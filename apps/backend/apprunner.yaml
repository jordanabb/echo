version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - yum install -y gcc gcc-c++ postgresql-devel geos-devel proj-devel gdal-devel gdal-libs
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: DATABASE_URL
      value: "SET_VIA_ENVIRONMENT"
    - name: CORS_ORIGINS
      value: "SET_VIA_ENVIRONMENT"
    - name: ENVIRONMENT
      value: "production"
