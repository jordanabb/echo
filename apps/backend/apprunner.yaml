      value: "postgresql://root:EchoRDS2026@dummynewamerica2.colozmht2nd8.us-east-1.rds.amazonaws.com:5432/newamerica?sslmode=require"
    - name: CORS_ORIGINS
      value: "https://dxssqmjdh6g8q.cloudfront.net"
    - name: ENVIRONMENT
      value: "production"
